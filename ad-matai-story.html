<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>עד מתי — סיפור אינטראקטיבי</title><style>body{background:#18251e;color:#f4f1df;font:20px/1.7 system-ui,Arial;margin:0;padding:5vh 5vw}main{max-width:780px;margin:auto;background:#283b2e;border:2px solid #849678;border-radius:16px;padding:28px}h1{margin-top:0}button{display:block;width:100%;margin:12px 0;padding:14px;text-align:right;background:#dfc98b;border:0;border-radius:9px;color:#1c291e;font:inherit;cursor:pointer}button:hover{background:#f5dfa0}p{white-space:pre-line}small{color:#d0d6c8}</style></head><body><main><h1>עד מתי</h1><small>הדגמת סיפור אינטראקטיבי • בחירות העלילה המרכזיות</small><div id="story"></div></main><script>const passages={"Start": "האוטובוס עוצר בבסיס. אתה יורד עם תיק, והמפקד מקבל את פניך.\n\nמפקד: \"ברוך הבא. כאן לומדים מהר — או שנשארים שבת.\"\n\n[[להתחיל את ההדרכה->Tutorial]]", "Tutorial": "המפקד מציג את המטווח, המטבח, רחבת המסדרים ועמדת השמירה. בכל תחנה יש משחקון קצר.\n\n[[לצאת לראן הראשון->Run]]", "Run": "ארבע מטלות מופיעות בסדר אקראי. אתה מנסה לסיים את כולן כדי לצאת הביתה.\n\n[[הצלחתי בכל הארבע->Home]]\n[[נכשלתי באחת המטלות->Failure]]", "Failure": "\"לא נורא, חייל. מחר עוד יום ארוך\", אומר המפקד. ה־EXP מהמטלות שהשלמת נשמר.\n\n[[לחזור לבסיס->Progress]]", "Home": "סוף סוף בבית: אוכל, שינה וחברים. אבל הבוקר מגיע, ואתה חוזר לבסיס.\n\n[[חוזרים לבסיס כרגיל->Progress]]\n[[הרס״ר מחכה בשער: ביקורת פתע!->Inspection]]", "Inspection": "\"השבוע ביקורת! כולם רצים!\" ארבע המטלות בראן הבא ברמת קושי קשה, והתגמול כפול.\n\n[[שרדתי את הביקורת->Progress]]\n[[נכשלתי בביקורת->Progress]]", "Progress": "הדרגות עולות עם EXP. כשהמד מתמלא, אתה פונה למפקד.\n\n[[להמשיך לשחק ולצבור EXP->Run]]\n[[צברתי מספיק EXP כדי להתקדם מסמ״ר->Commander]]", "Commander": "המפקד: \"כל הכבוד. עכשיו לך לשלישות. יש לך החלטה לקבל.\"\n\n[[להיכנס לשלישות->Personnel]]", "Personnel": "מש״קית השלישות: \"אז מה החלטת? להשתחרר או להישאר בקבע?\"\n\n[[אני משתחרר!->Discharge]]\n[[אני חותם קבע->Career]]", "Career": "חתמת קבע. הדרגות הבאות הן במסלול הנגדים: רס״ל, רס״ר, רס״ם, רס״ב ורנ״ג.\n\n[[לצבור EXP לקידום הבא->CareerPromotion]]", "CareerPromotion": "המפקד: \"שוב קידום? יפה. אז מה הפעם?\"\n\n[[להשתחרר עכשיו->Discharge]]\n[[להמשיך בקבע->Career]]\n[[הגעתי לרנ״ג, ממשיכים לשחק ללא קידום->MaxRank]]", "MaxRank": "אתה רנ״ג. כל ארבעת המשחקונים קשים. הדרגות נגמרו, אבל המטלות לא.\n\n[[לעשות עוד ראן->Run]]", "Discharge": "אתה יוצא בשער עם התיק בפעם האחרונה. מאחור נשמעת צעקה: \"חייל! רגע!\" — אבל הפעם אתה כבר אזרח.\n\n**סוף.**\n\n[[משחק חדש מטוראי->Start]]"};let current='Start';function show(id){current=id;const s=passages[id]||'קטע לא נמצא';let matches=[...s.matchAll(/\[\[([^\]]+?)\]\]/g)];let prose=s.replace(/\[\[([^\]]+?)\]\]/g,'').trim();const root=document.getElementById('story');root.replaceChildren();let p=document.createElement('p');p.textContent=prose.replace(/\*\*/g,'');root.appendChild(p);for(const m of matches){let [label,target]=m[1].split('->');let b=document.createElement('button');b.textContent=label;b.onclick=()=>show(target||label);root.appendChild(b)}}show('Start');</script></body></html>
